<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ammavan Reaction Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-container">
    <nav>
      <a href="index.html" class="brand">🐕 KUZHAL LAB v4.0</a>
      <div class="nav-links">
        <a href="home.html" class="nav-btn">🏛️ Bureau</a>
        <a href="game.html" class="nav-btn">🕹️ Kuzhal Arcade</a>
        <a href="ammavan.html" class="nav-btn active">👴 Ammavan Zone</a>
        <a href="certificate.html" class="nav-btn">📜 Certificate</a>
      </div>
    </nav>
  </div>

  <div class="main-wrapper">
    <div class="card" style="text-align:center; align-items:center;">
      <span class="card-title">AMMAVAN REACTION CHAMBER</span>

      <!-- Animated SVG Ammavan Face -->
      <div style="width:160px; height:160px; background:#ffde59; border:4px solid #000; box-shadow:4px 4px 0px #000; display:flex; align-items:center; justify-content:center; margin-top:1rem;">
        <svg width="130" height="130" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="#fbcfe8" stroke="#000" stroke-width="3"/>
          <path d="M 25 35 Q 38 28 45 35" fill="none" stroke="#000" stroke-width="3"/>
          <path d="M 55 35 Q 62 28 75 35" fill="none" stroke="#000" stroke-width="3"/>
          <circle cx="38" cy="45" r="4" fill="#000"/>
          <circle cx="62" cy="45" r="4" fill="#000"/>
          <!-- Mustache -->
          <path d="M 25 60 C 35 52 48 62 50 62 C 52 62 65 52 75 60 C 80 68 65 70 50 65 C 35 70 20 68 25 60 Z" fill="#000"/>
          <!-- Glasses (Hidden by default) -->
          <g id="ammavanGlasses" style="display:none;">
            <polygon points="20,38 48,38 44,48 24,48" fill="#000"/>
            <polygon points="52,38 80,38 76,48 56,48" fill="#000"/>
          </g>
        </svg>
      </div>

      <div id="ammavanDialogue" style="font-size:1.1rem; font-weight:900; background:#fff; border:3px solid #000; padding:1rem; box-shadow:4px 4px 0px #000; margin:1rem 0; width:100%;">
        👴 "Njan paranjille makkale... panthrandu kollam kuzhallittalum nivarilla!"
      </div>

      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:0.8rem; width:100%;">
        <button class="btn btn-yellow" id="btnPayasam">🥣 Offer Payasam</button>
        <button class="btn btn-pink" id="btnSteam">🔥 Apply 500 PSI</button>
        <button class="btn btn-green" id="btnGenz">🕶️ Inject GenZ CSS</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const dialogue = document.getElementById('ammavanDialogue');
    const glasses = document.getElementById('ammavanGlasses');

    document.getElementById('btnPayasam').addEventListener('click', () => {
      playAudio(440, 'sine', 0.2);
      glasses.style.display = 'none';
      dialogue.innerHTML = '👴 "Ah! Payasam! But the tail is still curly. Proverb remains undefeated!"';
    });

    document.getElementById('btnSteam').addEventListener('click', () => {
      playAudio(200, 'sawtooth', 0.3);
      glasses.style.display = 'none';
      dialogue.innerHTML = '👴 "Aiyyo! Extreme steam pressure! My proverb logic is melting!"';
    });

    document.getElementById('btnGenz').addEventListener('click', () => {
      playWinSound();
      glasses.style.display = 'block';
      dialogue.innerHTML = '👴 (DEFEATED): "<code>transform: rotate(0deg) !important</code> destroyed my 12-year theorem!"';
    });
  </script>
</body>
</html>
