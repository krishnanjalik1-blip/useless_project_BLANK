<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department of Tail Affairs | Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="header-container">
    <nav>
      <a href="index.html" class="brand">🐕 KUZHAL LAB v4.0</a>
      <div class="nav-links">
        <a href="index.html" class="nav-btn active">🏛️ Bureau</a>
        <a href="game.html" class="nav-btn">🕹️ Kuzhal Arcade</a>
        <a href="ammavan.html" class="nav-btn">👴 Ammavan Zone</a>
        <a href="certificate.html" class="nav-btn">📜 Certificate</a>
      </div>
    </nav>
  </div>

  <div class="main-wrapper">
    
    <!-- Hero / Stage Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="card-title">LIVE KUZHAL SIMULATOR</span>
        <span id="statusBadge" style="background:#ffde59; border:2px solid #000; padding:0.2rem 0.6rem; font-weight:900; font-size:0.75rem;">CURLED IN PIPE</span>
      </div>

      <div class="stage-box">
        <svg id="stageSvg" width="100%" height="180" viewBox="0 0 500 180">
          <!-- PVC Pipe -->
          <rect x="150" y="55" width="200" height="70" fill="#cbd5e1" stroke="#000" stroke-width="4" rx="6"/>
          <rect x="140" y="50" width="18" height="80" fill="#64748b" stroke="#000" stroke-width="3"/>
          <rect x="342" y="50" width="18" height="80" fill="#64748b" stroke="#000" stroke-width="3"/>
          <text x="250" y="95" font-size="11" font-weight="900" text-anchor="middle" fill="#000" opacity="0.6">KUZHAL-3000</text>

          <!-- Animated Tail Path -->
          <path id="svgTail" d="M 60 90 C 120 90, 180 75, 250 90 C 310 105, 380 40, 420 40 Q 440 20 410 20" fill="none" stroke="#d97706" stroke-width="14" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Quick Metrics -->
      <div class="badge-grid">
        <div class="metric-card">
          <div style="font-size:0.75rem; font-weight:900;">CURL ANGLE</div>
          <div class="metric-val" id="angleVal">180°</div>
        </div>
        <div class="metric-card">
          <div style="font-size:0.75rem; font-weight:900;">PRESSURE</div>
          <div class="metric-val" id="pressureVal">50 PSI</div>
        </div>
        <div class="metric-card">
          <div style="font-size:0.75rem; font-weight:900;">OUTCOME</div>
          <div class="metric-val" id="outcomeVal" style="font-size:1rem; color:#000;">NIVARILLA</div>
        </div>
      </div>
    </div>

    <!-- Quick Interactive Controls Card -->
    <div class="card">
      <span class="card-title">MECHANICS CONTROLS</span>

      <div class="control-box">
        <label>Canine Breed: <span id="breedLabel">Naadan Mix</span></label>
        <select id="breedSelect">
          <option value="naadan">Naadan Mix (k=1.2)</option>
          <option value="pug">Pug Double Spiral (k=3.5)</option>
          <option value="pomeranian">Pomeranian Fluff (k=1.8)</option>
          <option value="greyhound">Greyhound Loophole (Already Straight)</option>
        </select>
      </div>

      <div class="control-box">
        <label>Steam Pressure: <span id="pressureText">50 PSI</span></label>
        <input type="range" id="pressureInput" min="10" max="500" value="50">
      </div>

      <div style="display:flex; gap:0.8rem; flex-wrap:wrap; margin-top:0.5rem;">
        <button class="btn btn-green" id="runCalcBtn" style="flex:1;">🚀 RUN STRAIGHTENING ALGORITHM</button>
        <button class="btn btn-pink" id="forceCssBtn">🔥 FORCE CSS !important</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    const svgTail = document.getElementById('svgTail');
    const pressureInput = document.getElementById('pressureInput');
    const pressureText = document.getElementById('pressureText');
    const pressureVal = document.getElementById('pressureVal');
    const statusBadge = document.getElementById('statusBadge');
    const outcomeVal = document.getElementById('outcomeVal');

    pressureInput.addEventListener('input', (e) => {
      const p = e.target.value;
      pressureText.textContent = p + ' PSI';
      pressureVal.textContent = p + ' PSI';
      resetTail();
    });

    document.getElementById('runCalcBtn').addEventListener('click', () => {
      runSarcasticModal(() => {
        const breed = document.getElementById('breedSelect').value;
        const pressure = parseInt(pressureInput.value);

        if (pressure >= 450 || breed === 'greyhound') {
          straightenTail();
        } else {
          resetTail();
          alert("👴 AMMAVAN WINS! 50 PSI is too weak. Increase pressure to 500 PSI!");
        }
      });
    });

    document.getElementById('forceCssBtn').addEventListener('click', () => {
      playWinSound();
      straightenTail();
      outcomeVal.textContent = "CSS OVERRIDE!";
      outcomeVal.style.color = "#ff007f";
    });

    function straightenTail() {
      svgTail.setAttribute('d', 'M 60 90 L 440 90');
      statusBadge.textContent = '100% STRAIGHTENED';
      statusBadge.style.background = '#22c55e';
      outcomeVal.textContent = "STRAIGHT!";
      outcomeVal.style.color = "#22c55e";
      playWinSound();
    }

    function resetTail() {
      svgTail.setAttribute('d', 'M 60 90 C 120 90, 180 75, 250 90 C 310 105, 380 40, 420 40 Q 440 20 410 20');
      statusBadge.textContent = 'CURLED IN PIPE';
      statusBadge.style.background = '#ffde59';
      outcomeVal.textContent = "NIVARILLA";
      outcomeVal.style.color = "#000";
    }
  </script>
</body>
</html>
